name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo - messy report fails the gate
        run: |
          set +e
          python -m ds_check.cli samples/report_messy.json --now 2026-11-24T12:00:00Z
          code=$?
          set -e
          echo "demo exit code: $code"
          test "$code" -eq 2
      - name: Demo - clean report passes the gate
        run: python -m ds_check.cli samples/report_clean.json --now 2026-11-24T12:00:00Z
